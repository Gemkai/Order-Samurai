name: CI

# The missing safety net: v1.0.0 shipped a hook-registration defect (wrong
# settings.json + wrong schema) that `samurai doctor` reported as 5/5 PASS.
# The install-smoke job below exists specifically to catch that class of bug --
# it asserts the guard actually lands where Claude Code reads it, not just that
# `samurai install` exited 0.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with test extra
        run: python3 -m pip install -e ".[test]"

      - name: Run test suite
        # -m "not live_machine": excludes tests that need real platform homes or local
        # services (see pyproject.toml's marker definition and its own comment, which
        # claimed this flag was already here -- it was not, until this fix).
        #
        # set -o pipefail: without it, `tee`'s own exit code (always 0) replaces
        # pytest's in a pipeline, so a genuine test failure would report green here.
        run: |
          set -o pipefail
          python3 -m pytest tests/ agentica_core/tests/ -q -m "not live_machine" 2>&1 | tee /tmp/pytest-output.txt

      - name: Enforce a minimum passed-test floor
        # Exit 0 with a low pass count looks identical to exit 0 with a healthy one --
        # that gap is exactly how CI never running any tests went unnoticed here for
        # this repo's entire history (fixed above). This doesn't re-guard that specific
        # cause (pytest is now a declared dependency); it guards against a DIFFERENT,
        # still-open failure mode: a future change that makes pytest exit 0 while
        # silently collecting or running far fewer tests than before (a bad conftest.py,
        # an accidentally-widened -m filter, a directory quietly dropped from the
        # invocation). 1600 is comfortably below the 1652 measured at the time this was
        # added -- bump it up (never down) as the suite legitimately grows.
        run: |
          count="$(grep -oE '[0-9]+ passed' /tmp/pytest-output.txt | tail -1 | grep -oE '[0-9]+')"
          echo "tests passed: ${count:-0}"
          if [ -z "$count" ] || [ "$count" -lt 1600 ]; then
            echo "::error::only ${count:-0} tests passed (floor: 1600) -- possible silent collection failure or test-suite shrinkage"
            exit 1
          fi

  install-smoke:
    name: install smoke test
    runs-on: ubuntu-latest
    # Deliberately no `needs: test`: this job must run and report even when the unit-test
    # job fails, so an installer regression is never hidden behind an unrelated test
    # failure (see CHANGELOG's v1.0.0 hook-registration incident, referenced at the top of
    # this file).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python3 -m pip install -e .

      - name: Set up an isolated HOME
        run: |
          smoke_home="${{ runner.temp }}/smoke-home"
          mkdir -p "$smoke_home"
          echo "HOME=$smoke_home" >> "$GITHUB_ENV"

      - name: Pre-seed ~/.claude/settings.json with an unrelated user hook
        run: |
          mkdir -p "$HOME/.claude"
          cat > "$HOME/.claude/settings.json" <<'JSON'
          {
            "hooks": {
              "PreToolUse": [
                {"matcher": "Bash", "hooks": [{"type": "command", "command": "echo user_own_hook"}]}
              ]
            }
          }
          JSON

      - name: Run samurai install
        run: python3 bin/samurai install

      - name: Assert the guard is registered in Claude Code's own schema
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          settings_path = Path(os.environ["HOME"]) / ".claude" / "settings.json"
          data = json.loads(settings_path.read_text())

          def hooks_for(event):
              return data.get("hooks", {}).get(event, []) or []

          # (a) + (b): the guard command lands in ~/.claude/settings.json using
          # Claude Code's {"matcher", "hooks": [{"type": "command"}]} schema.
          pre_entries = hooks_for("PreToolUse")
          guard_entries = [
              e for e in pre_entries
              if isinstance(e, dict) and "matcher" in e
              and any(
                  isinstance(h, dict) and h.get("type") == "command"
                  and "prompt_injection_guard" in str(h.get("command", ""))
                  for h in (e.get("hooks") or [])
              )
          ]
          assert guard_entries, f"guard entry not found in Claude Code schema: {pre_entries}"

          # (c) the pre-existing user hook survived.
          user_hook_commands = [
              h.get("command", "")
              for e in pre_entries
              for h in (e.get("hooks") or [])
          ]
          assert any("user_own_hook" in c for c in user_hook_commands), \
              "pre-existing user hook was clobbered by install"

          # (d) the v1.0.0 stray file was NOT created.
          stray = Path(os.environ["HOME"]) / ".claude" / "hooks" / "settings.json"
          assert not stray.exists(), f"stray hook file created at {stray}"

          print("install-smoke: guard registration assertions passed")
          PY

      - name: Assert samurai doctor exits 0 with the guard registered
        run: python3 bin/samurai doctor

      - name: Remove the guard entry
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          settings_path = Path(os.environ["HOME"]) / ".claude" / "settings.json"
          data = json.loads(settings_path.read_text())
          pre_entries = data.get("hooks", {}).get("PreToolUse", []) or []
          data["hooks"]["PreToolUse"] = [
              e for e in pre_entries
              if not (
                  isinstance(e, dict)
                  and any(
                      isinstance(h, dict)
                      and "prompt_injection_guard" in str(h.get("command", ""))
                      for h in (e.get("hooks") or [])
                  )
              )
          ]
          settings_path.write_text(json.dumps(data, indent=2))
          print("install-smoke: guard entry removed")
          PY

      - name: Assert samurai doctor exits non-zero with no guard registered (no false green)
        run: |
          if python3 bin/samurai doctor; then
            echo "::error::samurai doctor exited 0 with the guard unregistered -- false green"
            exit 1
          fi
          echo "install-smoke: doctor correctly reported failure with the guard removed"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck every tracked shell script
        run: |
          # git ls-files, not a shell glob: tracked scripts only, and it correctly
          # reaches bin/*.sh, dashboard-ui/public/install.sh, and root install.sh in one
          # pass -- exactly what a shell glob like bin/*.sh silently fails to do (see
          # the git-hygiene fix above for that exact bug in the documented syntax check).
          mapfile -t scripts < <(git ls-files '*.sh')
          echo "checking ${#scripts[@]} tracked shell scripts"
          shellcheck --severity=warning "${scripts[@]}"

  packaging:
    name: public export pack integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the public core zip
        run: bash bin/build_core_zip.sh

      - name: Assert no internal-only material shipped in the public zip
        run: |
          hits="$(unzip -l dist/order-samurai-core.zip | grep -icE 'productization|__pycache__|\.pyc|\.ps1|INTERNAL_STRATEGY' || true)"
          echo "internal-material hits: $hits"
          if [ "$hits" -ne 0 ]; then
            echo "::error::public export pack contains internal-only material ($hits hits)"
            exit 1
          fi
